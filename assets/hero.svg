<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
<title id="title">MR.Burger — A little curiosity. A lot of building.</title>
<desc id="desc">A cream and orange developer poster featuring an illustrated burger, code window, and the profile of MR.Burger, a software developer studying ICT at Mahidol University in Thailand.</desc>
<defs>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#292a28" stroke-opacity=".07"/></pattern>
 <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#302f29" opacity=".12"/></pattern>
 <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#201c14" flood-opacity=".14"/></filter>
 <linearGradient id="titleShine" x1="0" x2="1" y1="0" y2="0" gradientUnits="objectBoundingBox">
  <stop offset="0" stop-color="#252724"/>
  <stop offset=".42" stop-color="#252724"/>
  <stop offset=".5" stop-color="#ff6439"/>
  <stop offset=".58" stop-color="#252724"/>
  <stop offset="1" stop-color="#252724"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;1 0" keyTimes="0;.5;1" dur="5s" repeatCount="indefinite"/>
 </linearGradient>
</defs>
<rect width="1280" height="660" rx="28" fill="#f6f3e9"/>
<rect width="1280" height="660" rx="28" fill="url(#grid)"/>
<path d="M754 0H1252Q1280 0 1280 28V660H985Z" fill="#ff6439"/>
<path d="M754 0H1252Q1280 0 1280 28V660H985Z" fill="url(#dots)"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#252724">
 <rect x="54" y="42" width="42" height="42" rx="21" fill="#252724"/>
 <text x="75" y="69" text-anchor="middle" fill="#f6f3e9" font-size="21" font-weight="800">B.</text>
 <text x="110" y="60" font-size="12" font-weight="700" letter-spacing="2">THE PERSONAL SPACE OF</text>
 <text x="110" y="79" font-size="13">tiansawang1818-pixel / GitHub</text>
 <path d="M54 113H700" stroke="#252724" stroke-opacity=".2"/>
 <text x="56" y="163" font-size="13" letter-spacing="3" font-weight="700">DEVELOPER. EXPLORER. BURGER.</text>
 <text x="48" y="264" font-size="100" font-weight="900" letter-spacing="-7" fill="url(#titleShine)">MR.BURGER</text>
 <text x="55" y="327" font-size="37" font-weight="700" letter-spacing="-1.3">A little curiosity.</text>
 <text x="55" y="374" font-size="37" font-weight="700" letter-spacing="-1.3">A lot of <tspan fill="#e34d28">building.</tspan></text>
 <text x="57" y="421" font-size="17" fill="#64665d">Shipping full-stack apps, APIs, and geospatial systems.</text>
 <text x="57" y="448" font-size="17" fill="#64665d">Open to software engineering internships.</text>
 <rect x="55" y="490" width="266" height="42" rx="21" fill="#252724"/>
 <circle cx="77" cy="511" r="4" fill="#b9e771"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
 <text x="91" y="516" font-size="12" font-weight="700" fill="#f6f3e9" letter-spacing=".5">MAHIDOL UNIVERSITY / ICT</text>
 <text x="342" y="516" font-size="13" font-weight="700">BASED IN THAILAND ↗</text>
 <path d="M54 573H700" stroke="#252724" stroke-opacity=".2"/>
 <text x="56" y="607" font-size="12" letter-spacing="2">SOFTWARE DEVELOPER</text>
 <text x="697" y="607" text-anchor="end" font-size="12" letter-spacing="1">EAT. SLEEP. CODE. REPEAT.</text>
</g>
<!-- A purpose-built mascot, drawn as editable SVG. -->
