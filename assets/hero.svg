 <text x="345" y="25" text-anchor="end" font-family="monospace" font-size="11" fill="#aaa99e">burger.js</text>
 <g font-family="monospace" font-size="15"><text x="22" y="70" fill="#e5adfb">const <tspan fill="#f6f3e9">burger = {</tspan></text><text x="36" y="94" fill="#f6f3e9">curiosity: <tspan fill="#b9e771">Infinity,</tspan></text><text x="36" y="118" fill="#f6f3e9">shipped: <tspan fill="#ffc66a">['WasmBot','HEAT//SHIFT'],</tspan></text><text x="36" y="142" fill="#f6f3e9">next: <tspan fill="#ffc66a">'your team?'</tspan></text><text x="22" y="166" fill="#f6f3e9">};<tspan fill="#ffc66a"><animate attributeName="opacity" values="1;0;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/>▍</tspan></text></g>
</g>
