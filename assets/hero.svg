 <path d="M985 84q-12-16 0-32t0-32"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin=".8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 10;0 -10" dur="2.6s" begin=".8s" repeatCount="indefinite"/></path>
 <path d="M1030 92q-12-16 0-32t0-32"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="1.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 10;0 -10" dur="2.6s" begin="1.6s" repeatCount="indefinite"/></path>
