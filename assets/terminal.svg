<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
<title id="t">burger@mahidol terminal</title>
<desc id="d">An animated terminal introducing Tiansawang Suetrong (MR.Burger), Digital Science and Technology student at Mahidol ICT, who has shipped WasmBot Studio, HEAT//SHIFT and a portfolio, and is open to software engineering internships in Bangkok.</desc>
<defs>
